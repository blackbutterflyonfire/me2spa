<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 350" width="100%" height="100%">
  <g transform="translate(10, 10) scale(0.32)">
    
  <defs>
    <!-- Liquid Satin Gold Gradients -->
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="20%" stop-color="#FDE8B6"/>
      <stop offset="48%" stop-color="#E2B363"/>
      <stop offset="78%" stop-color="#BA7F28"/>
      <stop offset="100%" stop-color="#7C4C12"/>
    </linearGradient>

    <linearGradient id="goldGleam" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FFF2D3"/>
      <stop offset="55%" stop-color="#E4B768"/>
      <stop offset="85%" stop-color="#B67B26"/>
      <stop offset="100%" stop-color="#6F3F0B"/>
    </linearGradient>

    <linearGradient id="goldEdge" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#72410C"/>
      <stop offset="35%" stop-color="#B47926"/>
      <stop offset="70%" stop-color="#E9C178"/>
      <stop offset="90%" stop-color="#FDF1D5"/>
      <stop offset="100%" stop-color="#C78E36"/>
    </linearGradient>

    <!-- Warm Ivory / Cream Satin Body Fills -->
    <linearGradient id="creamFill1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FAF4E8"/>
      <stop offset="80%" stop-color="#F2E6CE"/>
      <stop offset="100%" stop-color="#E3D0AF"/>
    </linearGradient>

    <linearGradient id="creamFill2" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="50%" stop-color="#F7EEDC"/>
      <stop offset="85%" stop-color="#ECE0C8"/>
      <stop offset="100%" stop-color="#DEC9A6"/>
    </linearGradient>

    <linearGradient id="creamBreast" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FBF5E9"/>
      <stop offset="65%" stop-color="#F3E7D1"/>
      <stop offset="100%" stop-color="#E4D2B2"/>
    </linearGradient>

    <!-- Layer Shadow -->
    <filter id="softShade" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="3" dy="5" stdDeviation="4.5" flood-color="#4A2807" flood-opacity="0.32"/>
    </filter>
  </defs>

  <g id="golden-swan" filter="url(#softShade)">
    <!-- ==================== WING TIER 1 (Top Primary Feather) ==================== -->
    <path d="M 188 248 C 225 285, 330 380, 415 450 C 510 530, 580 580, 615 605 C 570 575, 480 495, 395 410 C 310 325, 220 262, 188 248 Z"
          fill="url(#goldHighlight)" />
    <path d="M 205 272 C 265 335, 360 425, 455 505 C 530 568, 590 600, 605 602 C 565 572, 480 490, 400 405 C 330 330, 248 280, 205 272 Z"
          fill="url(#creamFill1)" />

    <!-- ==================== WING TIER 2 (Upper-Middle Feather) ==================== -->
    <path d="M 152 400 C 185 412, 280 455, 365 495 C 460 540, 535 568, 630 585 C 560 568, 460 525, 360 475 C 265 428, 185 408, 152 400 Z"
          fill="url(#goldEdge)" />
    <path d="M 172 414 C 235 435, 330 478, 425 522 C 510 560, 595 578, 620 582 C 555 562, 460 518, 365 468 C 285 428, 208 418, 172 414 Z"
          fill="url(#creamFill2)" />

    <!-- ==================== WING TIER 3 (Lower-Middle Feather) ==================== -->
    <path d="M 38 535 C 75 545, 180 595, 275 635 C 385 680, 500 705, 690 760 C 590 735, 480 695, 360 645 C 240 595, 95 545, 38 535 Z"
          fill="url(#goldGleam)" />
    <path d="M 68 550 C 145 580, 260 630, 375 675 C 485 715, 600 745, 678 755 C 585 730, 475 688, 360 638 C 245 588, 130 555, 68 550 Z"
          fill="url(#creamFill1)" />

    <!-- ==================== WING TIER 4 & LOWER TAIL FLICK ==================== -->
    <path d="M 75 755 C 130 780, 220 812, 330 832 C 450 852, 570 848, 700 812 C 610 828, 480 828, 360 805 C 240 780, 135 745, 75 755 Z"
