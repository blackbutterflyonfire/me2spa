    <path d="M 100 765 C 180 795, 280 822, 390 835 C 500 845, 620 835, 690 810 C 600 822, 480 820, 370 798 C 260 774, 160 752, 100 765 Z"
          fill="url(#creamFill2)" />

    <!-- ==================== BOTTOM BASE RIBBON (Cradles the Swan) ==================== -->
    <path d="M 160 870 C 240 920, 360 955, 490 960 C 640 965, 780 915, 875 825 C 805 890, 680 935, 530 935 C 380 935, 260 895, 160 870 Z"
          fill="url(#goldGleam)" />
    <path d="M 210 885 C 320 925, 440 945, 560 940 C 680 932, 790 885, 860 822 C 785 875, 675 912, 550 915 C 425 915, 310 888, 210 885 Z"
          fill="url(#creamBreast)" />

    <!-- ==================== VOLUPTUOUS BREAST & INNER BODY ==================== -->
    <path d="M 770 305 C 770 380, 720 480, 665 565 C 610 650, 595 720, 640 785 C 685 845, 765 875, 845 855 C 925 832, 970 755, 960 675 C 950 590, 890 515, 825 450 C 850 495, 890 575, 905 655 C 915 725, 885 785, 835 810 C 780 835, 715 815, 678 765 C 640 710, 645 640, 690 560 C 740 475, 775 390, 770 305 Z"
          fill="url(#goldHighlight)" />
    <path d="M 760 330 C 755 410, 710 500, 665 580 C 625 655, 630 725, 670 775 C 715 830, 790 848, 860 822 C 925 798, 955 735, 948 670 C 938 595, 880 525, 820 465 C 845 510, 890 585, 895 655 C 900 715, 875 765, 830 788 C 785 810, 730 795, 698 750 C 665 700, 665 635, 705 560 C 745 480, 768 405, 760 330 Z"
          fill="url(#creamBreast)" />

    <!-- ==================== SWAN S-CURVE NECK ==================== -->
    <!-- Gold neck outline / border -->
    <path d="M 710 135 C 640 145, 550 200, 535 295 C 520 395, 570 480, 630 565 C 690 650, 745 715, 810 750 C 848 725, 858 695, 860 675 C 800 705, 735 660, 675 580 C 615 500, 575 425, 578 340 C 580 270, 625 210, 690 185 C 720 172, 750 182, 775 208 C 788 222, 795 240, 790 260 C 778 270, 764 268, 752 260 C 738 240, 725 210, 710 135 Z"
          fill="url(#goldEdge)" />
    <!-- Cream neck body -->
    <path d="M 700 150 C 645 165, 570 215, 555 295 C 540 380, 580 460, 635 540 C 690 620, 745 680, 805 715 C 830 695, 838 672, 840 655 C 790 682, 730 640, 680 565 C 625 488, 592 418, 595 342 C 598 280, 635 228, 692 202 C 720 190, 745 200, 768 222 C 775 230, 780 242, 778 252 C 768 258, 758 255, 748 248 C 735 230, 720 205, 700 150 Z"
          fill="url(#creamFill1)" />

    <!-- ==================== SWAN HEAD ==================== -->
    <path d="M 700 138 C 725 138, 760 155, 785 190 C 802 215, 805 242, 792 268 C 768 285, 740 288, 722 278 C 702 265, 690 238, 690 208 C 690 172, 695 148, 700 138 Z"
          fill="url(#goldGleam)" />
    <path d="M 708 152 C 730 152, 755 168, 775 198 C 788 218, 790 238, 780 258 C 762 270, 740 270, 728 262 C 712 250, 704 230, 704 205 C 704 178, 706 160, 708 152 Z"
          fill="url(#creamFill1)" />

    <!-- ==================== 3-LEAF GOLDEN CROWN / CREST ==================== -->
    <!-- Middle Leaf (Tallest) -->
    <path d="M 728 138 C 715 102, 732 72, 755 52 C 764 82, 755 115, 728 138 Z"
          fill="url(#goldHighlight)" />
    <!-- Left Leaf -->
    <path d="M 705 145 C 682 120, 694 92, 715 80 C 720 106, 715 128, 705 145 Z"
          fill="url(#goldEdge)" />
    <!-- Right Leaf -->
    <path d="M 748 145 C 772 122, 796 114, 810 110 C 800 135, 780 155, 748 145 Z"
          fill="url(#goldGleam)" />

    <!-- ==================== SERENE CLOSED EYE & LASHES ==================== -->
    <path d="M 718 198 C 738 218, 760 238, 784 252"
          stroke="#5A3206" stroke-width="6.5" stroke-linecap="round" fill="none" />
    <!-- Eyelash flick 1 -->
    <path d="M 776 244 C 786 240, 794 232, 802 224"
          stroke="#5A3206" stroke-width="4.2" stroke-linecap="round" fill="none" />
    <!-- Eyelash flick 2 -->
    <path d="M 762 232 C 770 225, 778 218, 784 208"
          stroke="#5A3206" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- ==================== GOLDEN BEAK ==================== -->
    <path d="M 766 270 C 785 290, 812 320, 845 365 C 820 350, 790 320, 758 290 Z"
          fill="url(#goldEdge)" />
  </g>

  </g>
  <g transform="translate(370, 45)">
    
  <defs>
    <!-- Liquid Gold Gradient Matching Uploaded Image -->
    <linearGradient id="goldWordmark" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#EED59B"/>
      <stop offset="20%" stop-color="#C58D39"/>
      <stop offset="45%" stop-color="#DFAC56"/>
      <stop offset="65%" stop-color="#FCE1A8"/>
      <stop offset="85%" stop-color="#C48C37"/>
      <stop offset="100%" stop-color="#8F5914"/>
    </linearGradient>

    <linearGradient id="goldShine" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8B5512"/>
      <stop offset="35%" stop-color="#BA812D"/>
      <stop offset="70%" stop-color="#E5B766"/>
      <stop offset="90%" stop-color="#FFF2D1"/>
      <stop offset="100%" stop-color="#C68E38"/>
    </linearGradient>

    <linearGradient id="goldFlourish" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#BA812D"/>
      <stop offset="25%" stop-color="#ECC074"/>
      <stop offset="50%" stop-color="#FFF5DA"/>
      <stop offset="75%" stop-color="#DFAC56"/>
      <stop offset="100%" stop-color="#9C641D"/>
    </linearGradient>

    <filter id="subtleShade" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="2.5" flood-color="#462505" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g id="spavibe-typography" filter="url(#subtleShade)" fill="url(#goldWordmark)">
    <!-- ==================== 'S' FLOURISHED CAPITAL ==================== -->
    <!-- Top arch & finial -->
    <path d="M 235 52 C 220 38, 195 28, 168 28 C 125 28, 92 52, 92 88 C 92 118, 116 138, 155 152 C 205 170, 222 188, 222 215 C 222 250, 185 272, 138 272 C 105 272, 75 258, 55 240 L 60 218 C 78 238, 106 250, 136 250 C 172 250, 198 232, 198 205 C 198 176, 172 158, 132 142 C 86 125, 68 105, 68 76 C 68 40, 108 12, 165 12 C 196 12, 222 22, 240 38 Z"
          fill="url(#goldShine)" />
    <!-- S Signature Lower Swirl / Loop under baseline -->
    <path d="M 138 272 C 102 272, 72 252, 58 225 C 45 198, 48 162, 65 130 C 60 150, 58 175, 68 198 C 80 226, 108 245, 145 245 C 175 245, 198 230, 205 212 C 202 232, 175 272, 138 272 Z"
          fill="url(#goldFlourish)" opacity="0.95" />

    <!-- ==================== 'p' LOWERCASE ==================== -->
    <!-- Stem and descender -->
    <path d="M 270 95 L 292 95 L 292 245 L 270 245 L 270 230 C 265 240, 250 248, 235 248 C 205 248, 180 220, 180 170 C 180 120, 205 92, 235 92 C 250 92, 265 100, 270 110 Z M 270 145 C 270 125, 255 110, 240 110 C 220 110, 205 130, 205 170 C 205 210, 220 230, 240 230 C 255 230, 270 215, 270 195 Z"
          fill="url(#goldWordmark)" />

    <!-- ==================== 'a' LOWERCASE ==================== -->
    <path d="M 390 102 L 390 245 L 370 245 L 370 228 C 362 240, 348 248, 332 248 C 302 248, 282 228, 282 195 C 282 155, 312 140, 368 138 L 368 132 C 368 116, 355 108, 338 108 C 322 108, 308 115, 300 124 L 292 108 C 305 96, 324 90, 345 90 C 375 90, 390 102, 390 125 Z M 368 155 C 330 157, 306 168, 306 195 C 306 216, 320 230, 338 230 C 356 230, 368 218, 368 198 Z"
          fill="url(#goldWordmark)" />

    <!-- ==================== 'V' DRAMATIC FLOURISHED CAPITAL ==================== -->
    <!-- The majestic swooping flourish arching over 'ibe' -->
    <path d="M 432 245 L 405 95 L 430 95 L 442 205 C 465 150, 492 88, 515 48 C 538 16, 565 0, 608 0 C 655 0, 715 15, 785 45 L 778 65 C 715 38, 660 22, 615 22 C 580 22, 558 35, 538 65 C 510 110, 475 180, 452 245 Z"
          fill="url(#goldFlourish)" />
    <!-- V right stem -->
    <path d="M 432 245 L 532 95 L 555 95 L 452 245 Z"
          fill="url(#goldShine)" />

    <!-- ==================== 'i' LOWERCASE ==================== -->
    <!-- Dot of the i (Golden Circular Jewel) -->
    <circle cx="585" cy="58" r="14.5" fill="url(#goldShine)" />
    <!-- Stem of the i -->
    <path d="M 575 95 L 595 95 L 595 245 L 575 245 Z"
          fill="url(#goldWordmark)" />

    <!-- ==================== 'b' LOWERCASE ==================== -->
    <path d="M 618 35 L 638 35 L 638 112 C 646 100, 662 92, 678 92 C 710 92, 735 120, 735 170 C 735 220, 710 248, 678 248 C 662 248, 646 240, 638 228 L 638 245 L 618 245 Z M 638 145 L 638 195 C 638 215, 652 230, 670 230 C 690 230, 708 210, 708 170 C 708 130, 690 110, 670 110 C 652 110, 638 125, 638 145 Z"
          fill="url(#goldWordmark)" />

    <!-- ==================== 'e' LOWERCASE ==================== -->
    <path d="M 750 170 C 750 120, 775 92, 810 92 C 842 92, 868 118, 868 165 L 868 178 L 775 178 C 778 212, 794 230, 818 230 C 835 230, 850 220, 858 208 L 872 220 C 860 238, 840 248, 815 248 C 775 248, 750 220, 750 170 Z M 810 110 C 790 110, 778 125, 775 158 L 845 158 C 842 128, 830 110, 810 110 Z"
          fill="url(#goldWordmark)" />
  </g>

  </g>
</svg>