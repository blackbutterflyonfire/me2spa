<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Liquid Satin Gold Gradients -->
    <linearGradient id="goldEdge1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF5"/>
      <stop offset="18%" stop-color="#FBE6B3"/>
      <stop offset="42%" stop-color="#E1B15E"/>
      <stop offset="72%" stop-color="#B87C26"/>
      <stop offset="90%" stop-color="#885213"/>
      <stop offset="100%" stop-color="#5C3307"/>
    </linearGradient>

    <linearGradient id="goldEdge2" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFF9EA"/>
      <stop offset="25%" stop-color="#F8DE9F"/>
      <stop offset="50%" stop-color="#D9A44F"/>
      <stop offset="78%" stop-color="#AA6E1D"/>
      <stop offset="100%" stop-color="#6E3E0A"/>
    </linearGradient>

    <linearGradient id="goldEdge3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6A3B09"/>
      <stop offset="30%" stop-color="#A86D1E"/>
      <stop offset="65%" stop-color="#E2B464"/>
      <stop offset="88%" stop-color="#FDF1D5"/>
      <stop offset="100%" stop-color="#C28932"/>
    </linearGradient>

    <!-- Warm Satin Ivory / Pearlescent Feather Fills -->
    <linearGradient id="ivoryFill1" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FAF5EB"/>
      <stop offset="75%" stop-color="#F0E5CE"/>
      <stop offset="100%" stop-color="#E0CFAE"/>
    </linearGradient>

    <linearGradient id="ivoryFill2" x1="0%" y1="10%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="45%" stop-color="#F8EEDB"/>
      <stop offset="80%" stop-color="#EBDDC3"/>
      <stop offset="100%" stop-color="#D7BF9A"/>
    </linearGradient>

    <linearGradient id="ivoryBreast" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="28%" stop-color="#FAF4EA"/>
      <stop offset="60%" stop-color="#F2E6CE"/>
      <stop offset="90%" stop-color="#E5D3B3"/>
      <stop offset="100%" stop-color="#CFA86B"/>
    </linearGradient>

    <!-- Drop Shadow for Dimensional Separation -->
    <filter id="softShade" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#422405" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g id="swan-logo" filter="url(#softShade)">
    <!-- ==================== FEATHER 1 (TOP WING) ==================== -->
    <!-- Gold bevel spine -->
    <path d="M 175 212 C 220 260, 320 370, 410 448 C 505 528, 580 578, 620 600 C 575 572, 480 490, 390 405 C 300 318, 208 232, 175 212 Z"
          fill="url(#goldEdge1)" />
    <!-- Ivory body fill -->
    <path d="M 192 235 C 255 315, 350 420, 445 498 C 525 565, 590 595, 608 598 C 568 568, 482 485, 400 400 C 322 322, 235 250, 192 235 Z"
          fill="url(#ivoryFill1)" />

    <!-- ==================== FEATHER 2 (UPPER-MIDDLE WING) ==================== -->
    <!-- Gold bevel spine -->
    <path d="M 38 505 C 75 515, 185 575, 280 622 C 390 675, 510 710, 680 762 C 585 735, 475 692, 360 638 C 240 582, 100 520, 38 505 Z"
          fill="url(#goldEdge2)" />
    <!-- Ivory body fill -->
    <path d="M 65 522 C 145 562, 260 618, 375 668 C 485 712, 595 742, 668 752 C 578 726, 468 682, 355 628 C 242 572, 128 532, 65 522 Z"
          fill="url(#ivoryFill2)" />

    <!-- ==================== FEATHER 3 (LOWER-MIDDLE WING) ==================== -->
    <!-- Gold bevel spine -->
    <path d="M 72 735 C 130 765, 230 802, 340 825 C 460 848, 580 842, 700 808 C 610 825, 480 822, 360 798 C 240 768, 132 725, 72 735 Z"
          fill="url(#goldEdge3)" />
    <!-- Ivory body fill -->
    <path d="M 100 748 C 185 782, 290 812, 400 826 C 510 835, 620 826, 688 802 C 598 816, 478 812, 368 788 C 258 760, 155 732, 100 748 Z"
          fill="url(#ivoryFill1)" />

    <!-- ==================== BASE CRADLE RIBBON (BOTTOM OF SWAN) ==================== -->
    <!-- Outer gold contour -->
    <path d="M 195 870 C 275 922, 395 958, 525 962 C 675 965, 810 915, 898 825 C 830 892, 705 938, 555 938 C 405 938, 285 898, 195 870 Z"
          fill="url(#goldEdge1)" />
    <!-- Inner ivory fill -->
    <path d="M 245 885 C 350 925, 470 945, 590 940 C 710 930, 818 882, 882 820 C 810 875, 700 912, 575 915 C 450 915, 340 888, 245 885 Z"
          fill="url(#ivoryBreast)" />

    <!-- ==================== VOLUPTUOUS BREAST & BELLY ==================== -->
    <!-- Gold outer sweep -->
    <path d="M 770 305 C 770 380, 720 480, 665 565 C 610 650, 595 720, 640 785 C 685 845, 765 875, 845 855 C 925 832, 970 755, 960 675 C 950 590, 890 515, 825 450 C 850 495, 890 575, 905 655 C 915 725, 885 785, 835 810 C 780 835, 715 815, 678 765 C 640 710, 645 640, 690 560 C 740 475, 775 390, 770 305 Z"
          fill="url(#goldEdge2)" />
    <!-- Ivory breast body -->
    <path d="M 760 330 C 755 410, 710 500, 665 580 C 625 655, 630 725, 670 775 C 715 830, 790 848, 860 822 C 925 798, 955 735, 948 670 C 938 595, 880 525, 820 465 C 845 510, 890 585, 895 655 C 900 715, 875 765, 830 788 C 785 810, 730 795, 698 750 C 665 700, 665 635, 705 560 C 745 480, 768 405, 760 330 Z"
          fill="url(#ivoryBreast)" />

    <!-- ==================== SWAN S-CURVE NECK ==================== -->
    <!-- Gold neck outer ribbon -->
    <path d="M 710 135 C 640 145, 550 200, 535 295 C 520 395, 570 480, 630 565 C 690 650, 745 715, 810 750 C 848 725, 858 695, 860 675 C 800 705, 735 660, 675 580 C 615 500, 575 425, 578 340 C 580 270, 625 210, 690 185 C 720 172, 750 182, 775 208 C 788 222, 795 240, 790 260 C 778 270, 764 268, 752 260 C 738 240, 725 210, 710 135 Z"
          fill="url(#goldEdge3)" />
    <!-- Ivory neck body -->
    <path d="M 700 150 C 645 165, 570 215, 555 295 C 540 380, 580 460, 635 540 C 690 620, 745 680, 805 715 C 830 695, 838 672, 840 655 C 790 682, 730 640, 680 565 C 625 488, 592 418, 595 342 C 598 280, 635 228, 692 202 C 720 190, 745 200, 768 222 C 775 230, 780 242, 778 252 C 768 258, 758 255, 748 248 C 735 230, 720 205, 700 150 Z"
          fill="url(#ivoryFill1)" />

    <!-- ==================== SWAN HEAD ==================== -->
    <path d="M 700 138 C 725 138, 760 155, 785 190 C 802 215, 805 242, 792 268 C 768 285, 740 288, 722 278 C 702 265, 690 238, 690 208 C 690 172, 695 148, 700 138 Z"
          fill="url(#goldEdge2)" />
    <path d="M 708 152 C 730 152, 755 168, 775 198 C 788 218, 790 238, 780 258 C 762 270, 740 270, 728 262 C 712 250, 704 230, 704 205 C 704 178, 706 160, 708 152 Z"
          fill="url(#ivoryFill1)" />

    <!-- ==================== 3-LEAF GOLDEN CROWN / CREST ==================== -->
    <!-- Middle Leaf (Tallest) -->
    <path d="M 728 138 C 715 102, 732 72, 755 52 C 764 82, 755 115, 728 138 Z"
          fill="url(#goldEdge1)" />
    <!-- Left Leaf -->
    <path d="M 705 145 C 682 120, 694 92, 715 80 C 720 106, 715 128, 705 145 Z"
          fill="url(#goldEdge3)" />
    <!-- Right Leaf -->
    <path d="M 748 145 C 772 122, 796 114, 810 110 C 800 135, 780 155, 748 145 Z"
          fill="url(#goldEdge2)" />

    <!-- ==================== SERENE CLOSED EYE & LASHES ==================== -->
    <path d="M 718 198 C 738 218, 760 238, 784 252"
          stroke="#4D2804" stroke-width="6.5" stroke-linecap="round" fill="none" />
    <path d="M 776 244 C 786 240, 794 232, 802 224"
          stroke="#4D2804" stroke-width="4.2" stroke-linecap="round" fill="none" />
    <path d="M 762 232 C 770 225, 778 218, 784 208"
          stroke="#4D2804" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- ==================== GOLDEN BEAK ==================== -->
    <path d="M 766 270 C 785 290, 812 320, 845 365 C 820 350, 790 320, 758 290 Z"
          fill="url(#goldEdge3)" />
  </g>
</svg>