<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Liquid Satin Gold Gradients -->
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="20%" stop-color="#FDE8B6"/>
      <stop offset="48%" stop-color="#E2B363"/>
      <stop offset="78%" stop-color="#BA7F28"/>
      <stop offset="100%" stop-color="#7C4C12"/>
    </linearGradient>

    <linearGradient id="goldGleam" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FFF2D3"/>
      <stop offset="55%" stop-color="#E4B768"/>
      <stop offset="85%" stop-color="#B67B26"/>
      <stop offset="100%" stop-color="#6F3F0B"/>
    </linearGradient>

    <linearGradient id="goldEdge" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#72410C"/>
      <stop offset="35%" stop-color="#B47926"/>
      <stop offset="70%" stop-color="#E9C178"/>
      <stop offset="90%" stop-color="#FDF1D5"/>
      <stop offset="100%" stop-color="#C78E36"/>
    </linearGradient>

    <!-- Warm Ivory / Cream Satin Body Fills -->
    <linearGradient id="creamFill1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FAF4E8"/>
      <stop offset="80%" stop-color="#F2E6CE"/>
      <stop offset="100%" stop-color="#E3D0AF"/>
    </linearGradient>

    <linearGradient id="creamFill2" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="50%" stop-color="#F7EEDC"/>
      <stop offset="85%" stop-color="#ECE0C8"/>
      <stop offset="100%" stop-color="#DEC9A6"/>
    </linearGradient>

    <linearGradient id="creamBreast" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FBF5E9"/>
      <stop offset="65%" stop-color="#F3E7D1"/>
      <stop offset="100%" stop-color="#E4D2B2"/>
    </linearGradient>

    <!-- Layer Shadow -->
    <filter id="softShade" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="3" dy="5" stdDeviation="4.5" flood-color="#4A2807" flood-opacity="0.32"/>
    </filter>
  </defs>

  <g id="golden-swan" filter="url(#softShade)">
    <!-- ==================== WING TIER 1 (Top Primary Feather) ==================== -->
    <path d="M 188 248 C 225 285, 330 380, 415 450 C 510 530, 580 580, 615 605 C 570 575, 480 495, 395 410 C 310 325, 220 262, 188 248 Z"
          fill="url(#goldHighlight)" />
    <path d="M 205 272 C 265 335, 360 425, 455 505 C 530 568, 590 600, 605 602 C 565 572, 480 490, 400 405 C 330 330, 248 280, 205 272 Z"
          fill="url(#creamFill1)" />

    <!-- ==================== WING TIER 2 (Upper-Middle Feather) ==================== -->
    <path d="M 152 400 C 185 412, 280 455, 365 495 C 460 540, 535 568, 630 585 C 560 568, 460 525, 360 475 C 265 428, 185 408, 152 400 Z"
          fill="url(#goldEdge)" />
    <path d="M 172 414 C 235 435, 330 478, 425 522 C 510 560, 595 578, 620 582 C 555 562, 460 518, 365 468 C 285 428, 208 418, 172 414 Z"
          fill="url(#creamFill2)" />

    <!-- ==================== WING TIER 3 (Lower-Middle Feather) ==================== -->
    <path d="M 38 535 C 75 545, 180 595, 275 635 C 385 680, 500 705, 690 760 C 590 735, 480 695, 360 645 C 240 595, 95 545, 38 535 Z"
          fill="url(#goldGleam)" />
    <path d="M 68 550 C 145 580, 260 630, 375 675 C 485 715, 600 745, 678 755 C 585 730, 475 688, 360 638 C 245 588, 130 555, 68 550 Z"
          fill="url(#creamFill1)" />

    <!-- ==================== WING TIER 4 & LOWER TAIL FLICK ==================== -->
    <path d="M 75 755 C 130 780, 220 812, 330 832 C 450 852, 570 848, 700 812 C 610 828, 480 828, 360 805 C 240 780, 135 745, 75 755 Z"
          fill="url(#goldHighlight)" />
    <path d="M 100 765 C 180 795, 280 822, 390 835 C 500 845, 620 835, 690 810 C 600 822, 480 820, 370 798 C 260 774, 160 752, 100 765 Z"
          fill="url(#creamFill2)" />

    <!-- ==================== BOTTOM BASE RIBBON (Cradles the Swan) ==================== -->
    <path d="M 160 870 C 240 920, 360 955, 490 960 C 640 965, 780 915, 875 825 C 805 890, 680 935, 530 935 C 380 935, 260 895, 160 870 Z"
          fill="url(#goldGleam)" />
    <path d="M 210 885 C 320 925, 440 945, 560 940 C 680 932, 790 885, 860 822 C 785 875, 675 912, 550 915 C 425 915, 310 888, 210 885 Z"
          fill="url(#creamBreast)" />

    <!-- ==================== VOLUPTUOUS BREAST & INNER BODY ==================== -->
    <path d="M 770 305 C 770 380, 720 480, 665 565 C 610 650, 595 720, 640 785 C 685 845, 765 875, 845 855 C 925 832, 970 755, 960 675 C 950 590, 890 515, 825 450 C 850 495, 890 575, 905 655 C 915 725, 885 785, 835 810 C 780 835, 715 815, 678 765 C 640 710, 645 640, 690 560 C 740 475, 775 390, 770 305 Z"
          fill="url(#goldHighlight)" />
    <path d="M 760 330 C 755 410, 710 500, 665 580 C 625 655, 630 725, 670 775 C 715 830, 790 848, 860 822 C 925 798, 955 735, 948 670 C 938 595, 880 525, 820 465 C 845 510, 890 585, 895 655 C 900 715, 875 765, 830 788 C 785 810, 730 795, 698 750 C 665 700, 665 635, 705 560 C 745 480, 768 405, 760 330 Z"
          fill="url(#creamBreast)" />

    <!-- ==================== SWAN S-CURVE NECK ==================== -->
    <!-- Gold neck outline / border -->
    <path d="M 710 135 C 640 145, 550 200, 535 295 C 520 395, 570 480, 630 565 C 690 650, 745 715, 810 750 C 848 725, 858 695, 860 675 C 800 705, 735 660, 675 580 C 615 500, 575 425, 578 340 C 580 270, 625 210, 690 185 C 720 172, 750 182, 775 208 C 788 222, 795 240, 790 260 C 778 270, 764 268, 752 260 C 738 240, 725 210, 710 135 Z"
          fill="url(#goldEdge)" />
    <!-- Cream neck body -->
    <path d="M 700 150 C 645 165, 570 215, 555 295 C 540 380, 580 460, 635 540 C 690 620, 745 680, 805 715 C 830 695, 838 672, 840 655 C 790 682, 730 640, 680 565 C 625 488, 592 418, 595 342 C 598 280, 635 228, 692 202 C 720 190, 745 200, 768 222 C 775 230, 780 242, 778 252 C 768 258, 758 255, 748 248 C 735 230, 720 205, 700 150 Z"
          fill="url(#creamFill1)" />

    <!-- ==================== SWAN HEAD ==================== -->
    <path d="M 700 138 C 725 138, 760 155, 785 190 C 802 215, 805 242, 792 268 C 768 285, 740 288, 722 278 C 702 265, 690 238, 690 208 C 690 172, 695 148, 700 138 Z"
          fill="url(#goldGleam)" />
    <path d="M 708 152 C 730 152, 755 168, 775 198 C 788 218, 790 238, 780 258 C 762 270, 740 270, 728 262 C 712 250, 704 230, 704 205 C 704 178, 706 160, 708 152 Z"
          fill="url(#creamFill1)" />

    <!-- ==================== 3-LEAF GOLDEN CROWN / CREST ==================== -->
    <!-- Middle Leaf (Tallest) -->
    <path d="M 728 138 C 715 102, 732 72, 755 52 C 764 82, 755 115, 728 138 Z"
          fill="url(#goldHighlight)" />
    <!-- Left Leaf -->
    <path d="M 705 145 C 682 120, 694 92, 715 80 C 720 106, 715 128, 705 145 Z"
          fill="url(#goldEdge)" />
    <!-- Right Leaf -->
    <path d="M 748 145 C 772 122, 796 114, 810 110 C 800 135, 780 155, 748 145 Z"
          fill="url(#goldGleam)" />

    <!-- ==================== SERENE CLOSED EYE & LASHES ==================== -->
    <path d="M 718 198 C 738 218, 760 238, 784 252"
          stroke="#5A3206" stroke-width="6.5" stroke-linecap="round" fill="none" />
    <!-- Eyelash flick 1 -->
    <path d="M 776 244 C 786 240, 794 232, 802 224"
          stroke="#5A3206" stroke-width="4.2" stroke-linecap="round" fill="none" />
    <!-- Eyelash flick 2 -->
    <path d="M 762 232 C 770 225, 778 218, 784 208"
          stroke="#5A3206" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- ==================== GOLDEN BEAK ==================== -->
    <path d="M 766 270 C 785 290, 812 320, 845 365 C 820 350, 790 320, 758 290 Z"
          fill="url(#goldEdge)" />
  </g>
</svg>